[project]
name = "credit-risk-classification"
version = "0.1.0"
description = ""
authors = [
    {name = "null-route-dev",email = "null-route-dev@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "kagglehub (>=1.0.2,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "phik (>=0.12.5,<0.13.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "catboost (>=1.2.10,<2.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "optuna (>=4.9.0,<5.0.0)",
    "shap (>=0.52.0,<0.53.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
